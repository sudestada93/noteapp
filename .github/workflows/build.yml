name: Build APK

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK firmado
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log

      - name: Errores de compilación
        if: failure()
        run: |
          grep -E "^e: |What went wrong|Execution failed" -A2 build.log | head -150 || true

      - name: Renombrar APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/Libreta-v1.0.${{ github.run_number }}.apk
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: Libreta-apk
          path: dist/*.apk

      - name: Publicar en Releases (descarga directa desde el móvil)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Libreta v1.0.${{ github.run_number }}
          prerelease: false
          make_latest: true
          files: dist/*.apk
          body: |
            APK de Libreta compilado automáticamente desde `${{ github.ref_name }}` (${{ github.sha }}).
            Descargá el `.apk` en tu Android y abrilo para instalar (habilitá "Instalar apps desconocidas").
